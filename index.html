<!-- Painel administrativo (#admin) e app instalável (PWA): 23/10 — só é baixado quando o endereço tem #admin (visitantes comuns não baixam nada disto).
     Antes do painel, carrega também os textos de Projetos, Acervo, Trajetória e perfis, que ele lista e edita. -->
<script>
(function () {
  var pedido = false;
  var ARQUIVOS = ['admin/config.js', 'admin/totp.js', 'admin/banco.js', 'admin/vendor/qrcode.js', 'admin/pwa.js', 'admin/painel.js'];
  function estilo() { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'admin/admin.css'; document.head.appendChild(l); }
  function carregarAdmin() {
    if (pedido) return; pedido = true;
    var antes = (typeof SOB_DEMANDA !== 'undefined' ? SOB_DEMANDA.carregarTudo() : Promise.resolve());
    antes.catch(function () { /* segue mesmo assim */ }).then(function () {
      ARQUIVOS.forEach(function (src) { var s = document.createElement('script'); s.src = src; s.async = false; document.head.appendChild(s); });
    });
  }
  // Entrando direto por #admin: o estilo vem junto com a página (bloqueia a pintura), então o site nunca "pisca" antes do painel
  var estiloJa = false;
  if (location.hash === '#admin') { document.write('<link rel="stylesheet" href="admin/admin.css">'); estiloJa = true; }
  function conferir() {
    if (location.hash !== '#admin') return;
    if (!estiloJa) { estilo(); estiloJa = true; }
    carregarAdmin();
  }
  window.addEventListener('hashchange', conferir);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', conferir); else conferir();
})();
</script>
